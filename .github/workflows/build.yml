name: Linux builds and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 rpm cpio flatpak
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and UI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v
      - name: Application smoke test
        run: python smoke.py
      - name: Build and test native executable
        run: python build.py --arch x86_64
      - name: Install Flatpak build runtime
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install --noninteractive -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build and test deb, rpm and Flatpak
        run: python linux_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-x86_64
          path: release/LinuxPaint-*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish Linux packages together
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/LinuxPaint-* --title "Linux Paint ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --verify-tag
