name: Native builds and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, arch: x86_64, label: Linux-x86_64}
          - {os: windows-2022, arch: x86_64, label: Windows-x86_64}
          - {os: macos-15-intel, arch: x86_64, label: macOS-Intel}
          - {os: macos-15, arch: arm64, label: macOS-AppleSilicon}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and UI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v
      - name: Application smoke test
        run: python smoke.py
      - name: Build and test native executable
        run: python build.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/LinuxPaint-*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/LinuxPaint-* --title "Linux Paint ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --verify-tag
